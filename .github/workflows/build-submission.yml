name: Build submission artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-submission.yml"
      - "benchmark.py"
      - "vm_simulator/core.py"
      - "docs/generate_figures.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-artifacts-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate the complete benchmark dataset
        run: python benchmark.py
      - name: Generate charts
        run: python docs/generate_figures.py
      - name: Publish generated artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_results.csv benchmark_summary.csv benchmark_paired_summary.csv
          git add docs/figures
          git commit -m "Build benchmark data and figures" || exit 0
          git push origin HEAD:main

